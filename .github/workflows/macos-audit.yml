name: macOS audit

on:
  push:
    branches: [main, 'audit/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_UPDATE_TEST_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Release build
        run: swift build -c release
      - name: Hold-to-start regression
        if: always()
        run: python3 scripts/check-hold.py
      - name: Update checks and live GitHub request
        run: |
          swiftc -swift-version 6 -warnings-as-errors -parse-as-library Sources/VectorScroll/Updates.swift scripts/check-updates.swift -o .build/check-updates
          .build/check-updates
      - name: Build universal app bundle
        run: ./scripts/build-app.sh
      - name: Verify release bundle
        run: |
          lipo dist/VectorScroll.app/Contents/MacOS/VectorScroll -verify_arch arm64 x86_64
          codesign --verify --deep --strict dist/VectorScroll.app
          python3 scripts/check-bundle.py
      - name: Package installer
        run: |
          mkdir -p dist/installer
          cp -R dist/VectorScroll.app dist/installer/
          ln -s /Applications dist/installer/Applications
          hdiutil create -volname VectorScroll -srcfolder dist/installer -format UDZO dist/VectorScroll.dmg
          hdiutil verify dist/VectorScroll.dmg
      - name: Automatic installation and rollback
        run: |
          swiftc -swift-version 6 -warnings-as-errors -parse-as-library Sources/VectorScroll/Updates.swift Sources/VectorScroll/UpdateInstaller.swift scripts/check-installer.swift -o .build/check-installer
          .build/check-installer
      - uses: actions/upload-artifact@v4
        with:
          name: VectorScroll-1.5.1
          path: dist/VectorScroll.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-preview
          path: |
            .build/settings-preview.png
            .build/settings-delay-preview.png
          if-no-files-found: error
